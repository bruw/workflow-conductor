name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0

      # Neither step below needs a login.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.296

      - name: Validate the manifests and the hooks module
        run: claude plugin validate . --strict

      # No tsc here: it needs .claude-plugin/types/, which the engine writes
      # only once the mod has loaded in a session. Run `bun run check` locally.
      - name: Test
        run: claude plugin test .
